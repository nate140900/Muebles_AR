<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Muebles Aguilar</title>

    <script type="module"
        src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js">
    </script>

    <style>
        :root {
            --fondo: #e8e6e1;
            --tinta: #2b1f16;
            --suave: #6b5d50;
            --linea: #c9c4ba;
            --madera: #6e4524;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: var(--fondo);
            color: var(--tinta);
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            line-height: 1.5;
        }
        .volver {
            display: inline-block; margin: 16px 20px 0;
            color: var(--madera); font-weight: 600; font-size: .9rem; text-decoration: none;
        }
        .volver:focus-visible { outline: 3px solid var(--madera); outline-offset: 2px; }
        h1 {
            font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
            font-size: clamp(1.8rem, 7vw, 2.6rem);
            line-height: 1.1; margin: 12px 20px 16px;
        }
        model-viewer {
            width: 100%; height: 62vh; min-height: 320px;
            background-color: #dcd8cf;
            --progress-bar-color: var(--madera);
        }
        #ar-button {
            position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%);
            background: var(--tinta); color: #fff;
            border: none; border-radius: 8px;
            padding: 14px 24px; font-size: 1rem; font-weight: 600;
            cursor: pointer;
        }
        #ar-button:focus-visible { outline: 3px solid var(--madera); outline-offset: 3px; }
        .datos { max-width: 640px; margin: 0 auto; padding: 20px 20px 48px; }
        .datos p { margin: 0 0 12px; }
        .medidas { font-weight: 600; }
        .nota { color: var(--suave); font-size: .9rem; }
        #error { max-width: 640px; margin: 32px auto; padding: 0 20px; display: none; }
    </style>
</head>
<body>
    <a class="volver" href="index.html">Volver al catálogo</a>
    <h1 id="titulo">Cargando…</h1>

    <model-viewer id="visor"
        ar
        ar-modes="webxr scene-viewer quick-look"
        camera-controls
        auto-rotate
        shadow-intensity="1"
        alt="Mueble de madera">
        <button slot="ar-button" id="ar-button">Ver en mi espacio</button>
    </model-viewer>

    <section class="datos" id="datos">
        <p class="medidas" id="medidas" hidden></p>
        <p id="descripcion" hidden></p>
        <p class="nota">Si el botón «Ver en mi espacio» no aparece, tu celular no admite realidad aumentada. Aun así puedes girar y acercar el mueble con el dedo.</p>
    </section>

    <p id="error"></p>

    <script>
        const visor = document.getElementById('visor');

        function mostrarError(texto) {
            visor.style.display = 'none';
            document.getElementById('datos').style.display = 'none';
            document.getElementById('titulo').textContent = 'Mueble no disponible';
            const e = document.getElementById('error');
            e.textContent = texto;
            e.style.display = 'block';
        }

        const id = new URLSearchParams(location.search).get('m');

        fetch('muebles.json')
            .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
            .then(muebles => {
                const m = muebles.find(x => x.id === id);
                if (!m) {
                    mostrarError('No encontramos ese mueble. Vuelve al catálogo y elige uno de la lista.');
                    return;
                }
                document.title = m.nombre + ' · Muebles Aguilar';
                document.getElementById('titulo').textContent = m.nombre;
                visor.setAttribute('alt', m.nombre);
                visor.setAttribute('src', m.glb);
                visor.setAttribute('ios-src', m.usdz);

                if (m.medidas) {
                    const el = document.getElementById('medidas');
                    el.textContent = 'Medidas: ' + m.medidas;
                    el.hidden = false;
                }
                if (m.descripcion) {
                    const el = document.getElementById('descripcion');
                    el.textContent = m.descripcion;
                    el.hidden = false;
                }
            })
            .catch(() => {
                mostrarError('No se pudo cargar el mueble. Revisa tu conexión y vuelve a intentarlo.');
            });
    </script>
</body>
</html>
