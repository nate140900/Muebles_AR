<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Muebles Aguilar</title>
    <style>
        :root {
            --fondo: #e8e6e1;
            --tinta: #2b1f16;
            --suave: #6b5d50;
            --linea: #c9c4ba;
            --madera: #6e4524;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: var(--fondo);
            color: var(--tinta);
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            line-height: 1.5;
        }
        main { max-width: 640px; margin: 0 auto; padding: 48px 20px 64px; }
        h1 {
            font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
            font-size: clamp(2.4rem, 9vw, 3.6rem);
            line-height: 1.05;
            margin: 0 0 12px;
            font-weight: 700;
        }
        .intro { margin: 0 0 40px; color: var(--suave); max-width: 38ch; }
        ul { list-style: none; margin: 0; padding: 0; border-top: 2px solid var(--tinta); }
        li { border-bottom: 1px solid var(--linea); }
        a.mueble {
            display: flex; justify-content: space-between; align-items: baseline;
            gap: 16px; padding: 20px 4px;
            color: inherit; text-decoration: none;
        }
        a.mueble:hover .ver, a.mueble:focus-visible .ver { background: var(--madera); color: #fff; }
        a.mueble:focus-visible { outline: 3px solid var(--madera); outline-offset: 2px; }
        .nombre {
            font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
            font-size: 1.35rem; font-weight: 700; display: block;
        }
        .medidas { font-size: .9rem; color: var(--suave); }
        .ver {
            flex: none; font-size: .9rem; font-weight: 600;
            padding: 8px 14px; border: 1.5px solid var(--madera); border-radius: 6px;
            color: var(--madera);
        }
        #estado { color: var(--suave); padding: 20px 4px; }
    </style>
</head>
<body>
    <main>
        <h1>Muebles Aguilar</h1>
        <p class="intro">Elige un mueble y míralo en 3D o colócalo en tu espacio con la cámara del celular.</p>
        <ul id="lista"></ul>
        <p id="estado">Cargando catálogo…</p>
    </main>

    <script>
        const lista = document.getElementById('lista');
        const estado = document.getElementById('estado');

        fetch('muebles.json')
            .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
            .then(muebles => {
                if (!muebles.length) { estado.textContent = 'Todavía no hay muebles en el catálogo.'; return; }
                estado.remove();
                muebles.forEach(m => {
                    const li = document.createElement('li');
                    const a = document.createElement('a');
                    a.className = 'mueble';
                    a.href = 'mueble.html?m=' + encodeURIComponent(m.id);

                    const texto = document.createElement('span');
                    const nombre = document.createElement('span');
                    nombre.className = 'nombre';
                    nombre.textContent = m.nombre;
                    texto.appendChild(nombre);
                    if (m.medidas) {
                        const med = document.createElement('span');
                        med.className = 'medidas';
                        med.textContent = m.medidas;
                        texto.appendChild(med);
                    }

                    const ver = document.createElement('span');
                    ver.className = 'ver';
                    ver.textContent = 'Ver en 3D';

                    a.append(texto, ver);
                    li.appendChild(a);
                    lista.appendChild(li);
                });
            })
            .catch(() => {
                estado.textContent = 'No se pudo cargar el catálogo. Revisa tu conexión y vuelve a intentarlo.';
            });
    </script>
</body>
</html>
