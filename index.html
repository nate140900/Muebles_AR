<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Muebles Aguilar AR</title>

    <script type="module"
        src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js">
    </script>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            text-align: center;
        }

        h1 {
            margin-top: 25px;
        }

        model-viewer {
            width: 100%;
            height: 70vh;
            background-color: #eeeeee;
        }

        button {
            margin: 20px;
            padding: 15px 25px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <h1>Muebles Aguilar</h1>

    <model-viewer
        src="modelos/EspejoGiratorio_cajones/espejo-giratorio.glb"
        ios-src="modelos/EspejoGiratorio_cajones/espejo-giratorio.usdz"
        alt="Mueble de madera"
        ar
        ar-modes="webxr scene-viewer quick-look"
        camera-controls
        auto-rotate
        shadow-intensity="1">

        <button slot="ar-button">
            📱 Ver en mi espacio
        </button>

    </model-viewer>

</body>
</html>
